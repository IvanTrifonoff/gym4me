name: gym4me-next
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      GYM4ME_START_SERVER: "1"
      PORT: 3100
      ATHLETE_DATA_DIR: /var/lib/gym4me/data
      SESSION_SECRET: ${GYM4ME_SESSION_SECRET:-}
      ATHLETE_BODYWEIGHT_PG: ${ATHLETE_BODYWEIGHT_PG:-0}
      DATABASE_URL: ${GYM4ME_DATABASE_URL:-}
    volumes:
      - gym4me_data:/var/lib/gym4me/data
    ports:
      - "127.0.0.1:${GYM4ME_API_PORT:-3310}:3100"
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${GYM4ME_WEB_PORT:-3380}:80"
    depends_on:
      - api
    restart: unless-stopped
  bodyweight-db:
    image: postgres:14-alpine
    profiles: [bodyweight-db]
    environment:
      POSTGRES_DB: gym4me
      POSTGRES_USER: gym4me
      POSTGRES_PASSWORD: ${GYM4ME_DB_PASSWORD:-preview-only-change-me}
    volumes:
      - gym4me_bodyweight_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym4me -d gym4me"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  gym4me_data:
  gym4me_bodyweight_db:
